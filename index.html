<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор материалов и себестоимости</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #1a1a1a;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e1e4e8;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        td input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        td input:focus {
            border-color: #0066cc;
            outline: none;
            background-color: #f0f7ff;
        }

        .readonly-cell {
            background-color: #f9fafb;
            color: #555;
            font-weight: 500;
        }

        .totals-panel {
            display: flex;
            gap: 20px;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
            margin-top: 20px;
        }

        .total-item {
            flex: 1;
        }

        .total-item span {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .total-item strong {
            font-size: 20px;
            color: #111;
        }

        .total-item.highlight strong {
            color: #0066cc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Учет материалов и расчет себестоимости</h2>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по наименованию...">
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 30%;">Наименование</th>
                <th style="width: 15%;">Заметка</th>
                <th style="width: 12%;">Цена пачки (руб.)</th>
                <th style="width: 10%;">Кол-во в пачке</th>
                <th style="width: 11%;">Цена за 1 шт.</th>
                <th style="width: 11%;">Израсходовано</th>
                <th style="width: 11%;">Себестоимость</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Строки таблицы генерируются через JavaScript -->
        </tbody>
    </table>

    <div class="totals-panel">
        <div class="total-item highlight">
            <span>Итого себестоимость (израсходовано):</span>
            <strong id="total-cost">0.00 руб.</strong>
        </div>
        <div class="total-item">
            <span>Общая стоимость закупленных материалов:</span>
            <strong id="total-inventory">0.00 руб.</strong>
        </div>
    </div>
</div>

<script>
    // Массив данных о материалах
    const items = [
        { name: 'Мыльные розы (бутоны)', note: '', packPrice: '460.00', qty: '50', usedQty: '0' },
        { name: 'Упаковочная бумага', note: '', packPrice: '150.00', qty: '10', usedQty: '0' },
        { name: 'Мыльные розы ', note: '', packPrice: '460.00', qty: '25', usedQty: '0' },
        { name: 'Пакет маленький', note: '', packPrice: '25.00', qty: '1', usedQty: '0' },
        { name: 'Пакет средний', note: '', packPrice: '40.00', qty: '1', usedQty: '0' },
        { name: 'Пакет прямоугольный', note: '', packPrice: '78.00', qty: '1', usedQty: '0' },
        { name: 'Коробка шляпная маленькая', note: '', packPrice: '50.00', qty: '1', usedQty: '0' },
        { name: 'Коробка шляпная средняя', note: '', packPrice: '70.00', qty: '1', usedQty: '0' },
        { name: 'Коробка шляпная большая', note: '', packPrice: '100.00', qty: '1', usedQty: '0' },
        { name: 'Шпажки', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Упаковочный пакет', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Лента тонкая', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Лента средняя', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Лента широкая', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Пакет большой', note: '', packPrice: '55.00', qty: '1', usedQty: '0' },
        { name: 'Мыльные розы ', note: '', packPrice: '850.00', qty: '18', usedQty: '0' },
        { name: 'Бумага тишью', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Клей пистолетный', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Стразы', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Флористическая проволока', note: '', packPrice: '0.00', qty: '1', usedQty: '0' },
        { name: 'Бабочки', note: '', packPrice: '0.00', qty: '1', usedQty: '0' }
    ];

    let isEditing = false;

    // Отрисовка таблицы
    function renderTable(data = items) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        data.forEach((item, index) => {
            const packPrice = parseFloat(item.packPrice) || 0;
            const qty = parseFloat(item.qty) || 0;
            const usedQty = parseFloat(item.usedQty) || 0;

            const unitPrice = qty > 0 ? (packPrice / qty) : 0;
            const rowCost = unitPrice * usedQty;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="cell-input" data-index="${index}" data-field="name" value="${item.name}"></td>
                <td><input type="text" class="cell-input" data-index="${index}" data-field="note" value="${item.note}"></td>
                <td><input type="number" step="0.01" class="cell-input" data-index="${index}" data-field="packPrice" value="${item.packPrice}"></td>
                <td><input type="number" step="1" class="cell-input" data-index="${index}" data-field="qty" value="${item.qty}"></td>
                <td class="readonly-cell" id="unit-price-${index}">${unitPrice.toFixed(2)}</td>
                <td><input type="number" step="1" class="cell-input" data-index="${index}" data-field="usedQty" value="${item.usedQty}"></td>
                <td class="readonly-cell" id="row-cost-${index}">${rowCost.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });

        calculateTotals();
    }

    // Слушатель ввода изменений в ячейках
    document.addEventListener('input', (e) => {
        if (e.target.classList.contains('cell-input')) {
            isEditing = true;

            const index = e.target.getAttribute('data-index');
            const field = e.target.getAttribute('data-field');
            items[index][field] = e.target.value;

            // Пересчитываем отдельную строку
            updateRowCalculations(index);

            // Пересчитываем общие итоги
            calculateTotals();
        }
    });

    // Пересчет цены за 1 шт. и себестоимости строки
    function updateRowCalculations(index) {
        const item = items[index];
        const packPrice = parseFloat(item.packPrice) || 0;
        const qty = parseFloat(item.qty) || 0;
        const usedQty = parseFloat(item.usedQty) || 0;

        const unitPrice = qty > 0 ? (packPrice / qty) : 0;
        const rowCost = unitPrice * usedQty;

        const unitPriceEl = document.getElementById(`unit-price-${index}`);
        const rowCostEl = document.getElementById(`row-cost-${index}`);

        if (unitPriceEl) unitPriceEl.textContent = unitPrice.toFixed(2);
        if (rowCostEl) rowCostEl.textContent = rowCost.toFixed(2);
    }

    // Функция вычисления суммарных итогов
    function calculateTotals() {
        let totalCost = 0;
        let totalInventory = 0;

        items.forEach(item => {
            const packPrice = parseFloat(item.packPrice) || 0;
            const qty = parseFloat(item.qty) || 0;
            const usedQty = parseFloat(item.usedQty) || 0;

            const unitPrice = qty > 0 ? (packPrice / qty) : 0;

            totalCost += unitPrice * usedQty;
            totalInventory += packPrice;
        });

        const totalCostEl = document.getElementById('total-cost');
        const totalInventoryEl = document.getElementById('total-inventory');

        if (totalCostEl) totalCostEl.textContent = totalCost.toFixed(2) + ' руб.';
        if (totalInventoryEl) totalInventoryEl.textContent = totalInventory.toFixed(2) + ' руб.';
    }

    // Реализация поиска
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filteredItems = items.filter(item => item.name.toLowerCase().includes(query));
        renderTable(filteredItems);
    });

    // Первоначальная инициализация
    renderTable();
</script>

</body>
</html>
