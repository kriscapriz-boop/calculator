<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный калькулятор себестоимости</title>
    <style>
        :root {
            --pastel-mint: #e0f2f1;
            --mint-hover: #b2dfdb;
            --mint-border: #80cbd3;
            --mint-header: #4db6ac;
            --text-main: #264653;
            --bg-page: #f4fbfb;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            margin: 24px;
            color: var(--text-main);
        }
        
        .header-card {
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(77, 182, 172, 0.12);
            margin-bottom: 24px;
            border-left: 6px solid var(--mint-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: var(--text-main); margin: 0 0 6px 0; font-size: 1.6em; font-weight: 600; }
        .subtitle { color: #607d8b; margin: 0; font-size: 0.9em; }

        .sync-status {
            font-size: 0.85em;
            padding: 6px 12px;
            border-radius: 20px;
            background-color: #e0f2f1;
            color: #00796b;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--pastel-mint); }
        th { background-color: var(--pastel-mint); color: var(--text-main); font-weight: 600; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover { background-color: #fafefe; }

        /* Поля ввода */
        .cell-input {
            width: 100%;
            border: 1px dashed var(--mint-border);
            border-radius: 6px;
            padding: 6px 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95em;
            color: var(--text-main);
            background-color: #fbfdfe;
            outline: none;
            transition: all 0.2s;
        }

        .cell-input:focus {
            background-color: #ffffff;
            border: 1.5px solid var(--mint-header);
            box-shadow: 0 0 0 3px rgba(77, 182, 172, 0.2);
        }

        .number-col { text-align: right; }
        .auto-calc { background-color: var(--pastel-mint); font-weight: 600; color: var(--text-main); border-radius: 6px; padding: 6px 8px; display: block; }
        .total-row { background-color: var(--pastel-mint); font-weight: bold; font-size: 1.1em; }
        .total-row td { border-top: 2px solid var(--mint-border); }

        .btn-container { margin-top: 20px; display: flex; gap: 12px; }
        button { padding: 11px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9em; transition: all 0.2s ease; }
        
        .btn-add { background-color: var(--mint-header); color: white; box-shadow: 0 2px 8px rgba(77, 182, 172, 0.3); }
        .btn-add:hover { background-color: #39a096; transform: translateY(-1px); }
        .btn-reset { background-color: #b0bec5; color: white; }
        .btn-reset:hover { background-color: #90a4ae; }
        .btn-delete { background-color: #ffebee; color: #c62828; padding: 5px 10px; font-size: 0.8em; border-radius: 6px; }
        .btn-delete:hover { background-color: #e57373; color: white; }
    </style>
</head>
<body>

    <div class="header-card">
        <div>
            <h1>Облачный калькулятор себестоимости</h1>
            <p class="subtitle">Данные автоматически синхронизируются между всеми устройствами.</p>
        </div>
        <div id="status" class="sync-status">🟢 Облако подключено</div>
    </div>

    <table id="calcTable">
        <thead>
            <tr>
                <th style="width: 4%;">№</th>
                <th style="width: 28%;">Наименование</th>
                <th style="width: 18%;">Примечание</th>
                <th style="width: 15%;" class="number-col">Цена пачки/коробки (руб)</th>
                <th style="width: 12%;" class="number-col">Кол-во в пачке (шт)</th>
                <th style="width: 10%;" class="number-col">Цена за 1 шт (авто)</th>
                <th style="width: 10%;" class="number-col">Итого (руб)</th>
                <th style="width: 3%;"></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="6" style="text-align: right;">ОБЩАЯ СУММА ЗАКУПКИ:</td>
                <td class="number-col" id="grandTotal">0.00 руб.</td>
                <td></td>
            </tr>
        </tfoot>
    </table>

    <div class="btn-container">
        <button class="btn-add" onclick="addRow()">+ Добавить позицию</button>
        <button class="btn-reset" onclick="resetToDefault()">Сбросить всё</button>
    </div>

    <!-- Подключаем Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHCvoQNVlVXrFVEDBE61JrZrX9p0kW0Ac",
            authDomain: "continue-2daa0.firebaseapp.com",
            databaseURL: "https://continue-2daa0-default-rtdb.firebaseio.com",
            projectId: "continue-2daa0",
            storageBucket: "continue-2daa0.firebasestorage.app",
            messagingSenderId: "489888561978",
            appId: "1:489888561978:web:3498c007cde577b0ba6e03",
            measurementId: "G-857F5KS3EC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'calculator_data');

        let isEditing = false;
        let saveTimeout = null;

        // Отслеживаем ввод без перерисовки всей таблицы
        document.getElementById('tableBody').addEventListener('input', (e) => {
            isEditing = true;
            calculateTotals();
            
            // Таймер для отправки в базу (дебаунс), чтобы не перегружать сеть при каждом символе
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveToCloud();
                isEditing = false;
            }, 600);
        });

        // Слушаем изменения из базы
        onValue(dbRef, (snapshot) => {
            // Если пользователь прямо сейчас печатает, не перерисовываем, чтобы не сбить курсор
            if (isEditing) return;

            const data = snapshot.val();
            if (data) {
                renderTableFromData(data);
            } else {
                renderTableFromData([{ name: 'Мыльные розы (бутоны)', note: 'Коробка красных роз', packPrice: '460.00', qty: '50' }]);
            }
        });

        function calculateTotals() {
            const rows = document.querySelectorAll('#tableBody tr');
            let grandTotal = 0;

            rows.forEach((row, index) => {
                row.querySelector('.row-num').innerText = index + 1;

                const packPriceInput = row.querySelector('.cell-pack-price');
                const qtyInput = row.querySelector('.cell-qty');

                const packPrice = parseFloat(packPriceInput.value.replace(',', '.')) || 0;
                const qty = parseFloat(qtyInput.value.replace(',', '.')) || 0;

                const unitPrice = qty > 0 ? (packPrice / qty) : 0;
                row.querySelector('.cell-unit-price').innerText = unitPrice.toFixed(2);

                const total = packPrice;
                row.querySelector('.cell-total').innerText = total.toFixed(2);

                grandTotal += total;
            });

            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2) + " руб.";
        }

        function renderTableFromData(data) {
            const tbody = document.getElementById('tableBody');
            
            // Запоминаем активный элемент, если он есть
            const activeElement = document.activeElement;
            const activeRowIndex = activeElement ? activeElement.closest('tr')?.rowIndex : -1;
            const activeClass = activeElement ? activeElement.className : '';

            tbody.innerHTML = '';
            data.forEach(item => {
                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td class="row-num"></td>
                    <td><input type="text" class="cell-input cell-name" value="${item.name || ''}"></td>
                    <td><input type="text" class="cell-input cell-note" value="${item.note || ''}"></td>
                    <td><input type="text" class="cell-input number-col cell-pack-price" value="${item.packPrice || '0.00'}"></td>
                    <td><input type="text" class="cell-input number-col cell-qty" value="${item.qty || '1'}"></td>
                    <td><span class="number-col auto-calc cell-unit-price">0.00</span></td>
                    <td><span class="number-col auto-calc cell-total">0.00</span></td>
                    <td><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
                `;
                tbody.appendChild(newRow);
            });

            calculateTotals();
        }

        function saveToCloud() {
            const rows = document.querySelectorAll('#tableBody tr');
            const data = [];
            rows.forEach(row => {
                data.push({
                    name: row.querySelector('.cell-name').value,
                    note: row.querySelector('.cell-note').value,
                    packPrice: row.querySelector('.cell-pack-price').value,
                    qty: row.querySelector('.cell-qty').value
                });
            });
            set(dbRef, data);
        }

        window.addRow = function() {
            const tbody = document.getElementById('tableBody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td class="row-num"></td>
                <td><input type="text" class="cell-input cell-name" value="Новый материал"></td>
                <td><input type="text" class="cell-input cell-note" value="Упаковка/штуки"></td>
                <td><input type="text" class="cell-input number-col cell-pack-price" value="0.00"></td>
                <td><input type="text" class="cell-input number-col cell-qty" value="1"></td>
                <td><span class="number-col auto-calc cell-unit-price">0.00</span></td>
                <td><span class="number-col auto-calc cell-total">0.00</span></td>
                <td><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
            `;
            tbody.appendChild(newRow);
            calculateTotals();
            saveToCloud();
        };

        window.deleteRow = function(button) {
            button.parentElement.parentElement.remove();
            calculateTotals();
            saveToCloud();
        };

        window.resetToDefault = function() {
            if (confirm("Очистить базу данных?")) {
                set(dbRef, [{ name: 'Мыльные розы (бутоны)', note: 'Коробка красных роз', packPrice: '460.00', qty: '50' }]);
            }
        };
    </script>
</body>
</html>
